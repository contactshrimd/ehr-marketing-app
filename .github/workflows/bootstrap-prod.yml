name: Bootstrap Vercel prod

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    outputs:
      project_id: ${{ steps.bootstrap.outputs.project_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Create prod project and attach shrimd.com
        id: bootstrap
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: bash scripts/bootstrap-vercel-prod.sh
      - name: Deploy current SHA to prod
        timeout-minutes: 8
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ steps.bootstrap.outputs.project_id }}
        run: |
          npx --yes vercel@65.2.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@65.2.0 build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@65.2.0 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Record project id
        run: echo "Created or reused ${{ steps.bootstrap.outputs.project_id }}"
