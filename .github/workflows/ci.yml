name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: ci-placeholder-not-real
      LEAD_NOTIFICATION_FROM: leads@shrimd.com
      LEAD_NOTIFICATION_TO: ops@shrimd.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run seo-guardrails
      - run: npm run build
